name: Independent UI UX and feel audit
on:
  pull_request:
    paths: ['scripts/ux/**', 'app/src/main/**', '.github/workflows/ui-ux-audit.yml']
  push:
    branches: [main]
    paths: ['scripts/ux/**', '!scripts/ux/native-navigation.py', 'app/src/main/res/**', 'app/src/main/AndroidManifest.xml', '.github/workflows/ui-ux-audit.yml', 'app/src/main/java/ru/tabatabata/*Screen.kt', 'app/src/main/java/ru/tabatabata/AppLayouts.kt', 'app/src/main/java/ru/tabatabata/SupportDialog.kt', 'app/src/main/java/ru/tabatabata/MainActivity.kt', 'app/src/main/java/ru/tabatabata/PlanPreviewDialog.kt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-adfox-html
      ORG_GRADLE_PROJECT_privacyUrl: https://github.com/DanilaH/tabata-bata/blob/main/docs/privacy-policy.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Select focused PR checks or the complete release matrix
        id: profiles
        env:
          UI_AUDIT_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY_MATRIX' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          profiles = json.loads(Path('scripts/ux/profiles.json').read_text())
          if os.environ['UI_AUDIT_EVENT'] == 'pull_request':
              names = {'ru-narrow-200', 'en-narrow-200', 'ru-landscape-200', 'en-landscape-200-caption'}
              profiles = [p for p in profiles if p['profile'] in names]
              assert len(profiles) == 4
              for profile in profiles:
                  methods = ['c_historyLongNamesAndExpandedPlan', 'e_workoutAllStagesClockGridAndLock',
                             'r_historyRepeatedNavigationAndWorkoutReturn'] if profile['orientation'] == 'portrait' else ['e_workoutAllStagesClockGridAndLock']
                  profile['classes'] = ','.join('ru.tabatabata.UxAuditProbe#' + method for method in methods)
          print('matrix=' + json.dumps({'include': profiles}, separators=(',', ':')))
          PY_MATRIX
      - run: cp scripts/ux/UxAuditProbe.kt app/src/androidTest/java/ru/tabatabata/
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ux-audit-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  inspect:
    needs: build
    name: UI (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ux-audit-apks
          path: audit-apks
      - name: Start audio sink for demo banner video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          echo "PULSE_SERVER=$(pactl info | sed -n 's/^Server String: //p')" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_SIZE: ${{ matrix.size }}
          UX_DENSITY: ${{ matrix.density }}
          UX_FONT: ${{ matrix.font }}
          UX_LOCALE: ${{ matrix.locale }}
          UX_ORIENTATION: ${{ matrix.orientation }}
          UX_THEME: ${{ matrix.theme }}
          UX_FEEL: ${{ matrix.feel }}
          UX_CLASS: ${{ matrix.classes || 'ru.tabatabata.UxAuditProbe' }}
          UX_PICKERS: ${{ matrix.feel }}
          QEMU_AUDIO_DRV: pa
        with:
          api-level: ${{ matrix.api }}
          avd-name: tabata-ui
          pre-emulator-launch-script: python3 scripts/ux/configure-avd.py
          ram-size: 3072
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu lavapipe -no-snapshot -no-boot-anim -camera-back none
          script: bash scripts/ux/run.sh
      - name: Retain host failure evidence
        if: always()
        run: |
          mkdir -p ui-audit-results
          free -m > ui-audit-results/host-memory-final.txt
          sudo journalctl -k --since '-25 minutes' --no-pager > ui-audit-results/host-kernel.txt
          sudo coredumpctl --no-pager info --since '-25 minutes' > ui-audit-results/host-coredumps.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-audit-${{ matrix.profile }}
          path: ui-audit-results/
