name: Independent UI UX and feel audit
on:
  push:
    branches: [ui-ux-audit-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-adfox-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: cp scripts/ux/UxAuditProbe.kt app/src/androidTest/java/ru/tabatabata/
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: ux-audit-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
  inspect:
    needs: build
    name: UI (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {profile: ru-normal, api: 35, size: '1080x1920', density: 420, font: '1.0', locale: ru, orientation: portrait, theme: light, feel: 'true'}
          - {profile: ru-narrow-200, api: 35, size: '960x1704', density: 480, font: '2.0', locale: ru, orientation: portrait, theme: light, feel: 'false'}
          - {profile: en-narrow-150, api: 35, size: '960x1704', density: 480, font: '1.5', locale: en, orientation: portrait, theme: dark, feel: 'false'}
          - {profile: en-landscape-150, api: 35, size: '1080x1920', density: 480, font: '1.5', locale: en, orientation: landscape, theme: dark, feel: 'false'}
          - {profile: ru-landscape-200, api: 35, size: '1080x1920', density: 480, font: '2.0', locale: ru, orientation: landscape, theme: light, feel: 'false'}
          - {profile: ru-tablet, api: 35, size: '1200x1920', density: 240, font: '1.0', locale: ru, orientation: portrait, theme: dark, feel: 'false'}
          - {profile: en-android16, api: 36, size: '1080x1920', density: 420, font: '1.0', locale: en, orientation: portrait, theme: light, feel: 'false'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ux-audit-apks
          path: audit-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_SIZE: ${{ matrix.size }}
          UX_DENSITY: ${{ matrix.density }}
          UX_FONT: ${{ matrix.font }}
          UX_LOCALE: ${{ matrix.locale }}
          UX_ORIENTATION: ${{ matrix.orientation }}
          UX_THEME: ${{ matrix.theme }}
          UX_FEEL: ${{ matrix.feel }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: bash scripts/ux/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-audit-${{ matrix.profile }}
          path: ui-audit-results/
