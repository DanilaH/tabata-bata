name: Native UI navigation outside instrumentation
# Physical contrast is checked in both device light and device dark modes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/ux/native-navigation.py', 'scripts/ux/configure-avd.py', '.github/workflows/native-ui-audit.yml', 'app/src/main/java/ru/tabatabata/MainActivity.kt', 'app/src/main/res/values/styles.xml', 'app/src/main/res/values-night/styles.xml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-adfox-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: native-ui-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  inspect:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: phone, size: '1080x1920', density: 420}
          - {profile: tablet, size: '1200x1920', density: 240}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-ui-apk
          path: native-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_SIZE: ${{ matrix.size }}
          UX_DENSITY: ${{ matrix.density }}
        with:
          api-level: 35
          avd-name: tabata-ui
          pre-emulator-launch-script: python3 scripts/ux/configure-avd.py
          ram-size: 3072
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r native-apk/app-debug.apk
            python3 scripts/ux/native-navigation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-${{ matrix.profile }}
          path: ui-audit-results/
