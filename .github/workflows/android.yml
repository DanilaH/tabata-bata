name: Android checks and APK
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', 'gradle.properties', 'gradle/**', 'gradlew', 'gradlew.bat', '.github/workflows/android.yml', 'scripts/android-*.py', 'scripts/fixtures/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tabata-bata-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tabata-bata-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: |
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib/apksigner.jar
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/zipalign
            ${{ env.ANDROID_HOME }}/build-tools/36.0.0/lib64/
  emulator:
    name: emulator (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    env:
      QEMU_AUDIO_DRV: wav
      QEMU_WAV_PATH: /tmp/tabata-android-audio.wav
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          ram-size: 3072
          disable-animations: true
          emulator-options: -no-window -gpu lavapipe -no-snapshot -no-boot-anim -camera-back none
          script: |
            ./gradlew connectedDebugAndroidTest
            python3 scripts/android-system-check.py
            ./gradlew assembleRelease writeDebugKeystorePath
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks "$(cat app/build/debug-keystore-path.txt)" --ks-pass pass:android --key-pass pass:android --out /tmp/tabata-release-smoke.apk app/build/outputs/apk/release/app-release-unsigned.apk
            SMOKE_RELEASE=1 SMOKE_APK=/tmp/tabata-release-smoke.apk SMOKE_OUT=app/build/reports/release-system-check python3 scripts/android-system-check.py
      - name: Retain emulator host evidence
        if: always()
        run: |
          mkdir -p app/build/reports/emulator-host
          stat "$QEMU_WAV_PATH" > app/build/reports/emulator-host/audio-file.txt 2>&1 || true
          free -m > app/build/reports/emulator-host/memory.txt
          sudo journalctl -k --since '-25 minutes' --no-pager > app/build/reports/emulator-host/kernel.txt
          sudo coredumpctl --no-pager info --since '-25 minutes' > app/build/reports/emulator-host/coredumps.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-test-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/system-check/
            app/build/reports/release-system-check/
            app/build/reports/emulator-host/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ matrix.api }}
          path: app/build/outputs/connected_android_test_additional_output/
          if-no-files-found: error

  compatibility:
    name: compatibility and upgrade (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 68e605f9da83fdfb830a5c2b58decf9427081df7
          path: baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare cross-version fixture
        run: |
          cp scripts/fixtures/UpgradeStateTest.kt app/src/androidTest/java/ru/tabatabata/
          cp scripts/fixtures/UpgradeStateTest.kt baseline/app/src/androidTest/java/ru/tabatabata/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.tabatabata.ResilienceTest,ru.tabatabata.StoreRoundTripTest,ru.tabatabata.EditorControlsTest,ru.tabatabata.HistoryRepositoryTest
            python3 scripts/android-system-check.py
            ./gradlew -p baseline assembleDebug assembleDebugAndroidTest
            ./gradlew assembleRelease assembleDebugAndroidTest writeDebugKeystorePath
            $ANDROID_HOME/build-tools/36.0.0/apksigner sign --ks "$(cat app/build/debug-keystore-path.txt)" --ks-pass pass:android --key-pass pass:android --out /tmp/tabata-upgrade-release.apk app/build/outputs/apk/release/app-release-unsigned.apk
            UPGRADE_RELEASE_APK=/tmp/tabata-upgrade-release.apk python3 scripts/android-upgrade-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-reports-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/system-check/
            app/build/reports/upgrade-check/
