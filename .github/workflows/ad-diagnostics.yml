name: Isolated banner diagnosis
on:
  push:
    branches: [ad-diagnostics-20261111]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  banner:
    name: Banner (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [current, main-host, version09, without-review, baseline]
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-yandex
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare isolated comparison
        env:
          DIAGNOSTIC_VARIANT: ${{ matrix.variant }}
        run: |
          cp scripts/ads/diagnostics/BannerDiagnosticTest.kt /tmp/BannerDiagnosticTest.kt
          cp scripts/ads/diagnostics/variant.py /tmp/variant.py
          if [ "$DIAGNOSTIC_VARIANT" = baseline ]; then git checkout --detach d401cd3496b2b3095349131b1b56c1fae6c31146; fi
          python3 /tmp/variant.py "$DIAGNOSTIC_VARIANT"
          mkdir -p diagnostic-evidence
          git rev-parse HEAD > diagnostic-evidence/source.txt
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > diagnostic-evidence/dependencies.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=ru.tabatabata.BannerDiagnosticTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banner-diagnostic-${{ matrix.variant }}
          path: |
            diagnostic-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
