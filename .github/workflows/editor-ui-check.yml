name: Focused UI regressions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/editor-ui-check.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: ru-normal-full-lavapipe, api: 35, size: '1080x1920', density: 420, font: '1.0', locale: ru, orientation: portrait, theme: light, feel: 'true', classes: 'ru.tabatabata.UxAuditProbe'}
          - {profile: en-android16-tail-lavapipe, api: 36, size: '1080x1920', density: 420, font: '1.0', locale: en, orientation: portrait, theme: light, feel: 'false', classes: 'ru.tabatabata.UxAuditProbe#a_homeMenuAndLongSavedNames,ru.tabatabata.UxAuditProbe#k_queueAndLargeSupportContent,ru.tabatabata.UxAuditProbe#n_filePickerCancellationAndThemePersistence'}
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-adfox-html
      ORG_GRADLE_PROJECT_privacyUrl: https://github.com/DanilaH/tabata-bata/blob/main/docs/privacy-policy.md
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: cp scripts/ux/UxAuditProbe.kt app/src/androidTest/java/ru/tabatabata/
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - run: |
          mkdir -p audit-apks/debug audit-apks/androidTest/debug
          cp app/build/outputs/apk/debug/app-debug.apk audit-apks/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk audit-apks/androidTest/debug/
      - name: Start audio sink for demo banner video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          echo "PULSE_SERVER=$(pactl info | sed -n 's/^Server String: //p')" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_SIZE: ${{ matrix.size }}
          UX_DENSITY: ${{ matrix.density }}
          UX_FONT: ${{ matrix.font }}
          UX_LOCALE: ${{ matrix.locale }}
          UX_ORIENTATION: ${{ matrix.orientation }}
          UX_THEME: ${{ matrix.theme }}
          UX_FEEL: ${{ matrix.feel }}
          UX_CLASS: ${{ matrix.classes }}
          UX_NATIVE: true
          UX_PICKERS: true
          QEMU_AUDIO_DRV: pa
        with:
          api-level: ${{ matrix.api }}
          avd-name: tabata-ui
          pre-emulator-launch-script: python3 scripts/ux/configure-avd.py
          ram-size: 3072
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu lavapipe -no-snapshot -no-boot-anim -camera-back none
          script: bash scripts/ux/run.sh
      - name: Retain emulator host diagnostics
        if: always()
        run: |
          mkdir -p ui-audit-results
          sudo journalctl -k --since '-15 minutes' --no-pager > ui-audit-results/host-kernel.txt
          sudo coredumpctl --no-pager info --since '-15 minutes' > ui-audit-results/host-coredumps.txt 2>&1 || true
          ls -lR /tmp/android-runner > ui-audit-results/emulator-crash-files.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-ui-${{ matrix.profile }}
          path: ui-audit-results/
