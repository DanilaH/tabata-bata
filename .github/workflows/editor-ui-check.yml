name: Focused editor keyboard check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/editor-ui-check.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORG_GRADLE_PROJECT_bannerId: demo-banner-adfox-html
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: cp scripts/ux/UxAuditProbe.kt app/src/androidTest/java/ru/tabatabata/
      - run: ./gradlew assembleDebug assembleDebugAndroidTest
      - run: |
          mkdir -p audit-apks/debug audit-apks/androidTest/debug
          cp app/build/outputs/apk/debug/app-debug.apk audit-apks/debug/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk audit-apks/androidTest/debug/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          UX_SIZE: 960x1704
          UX_DENSITY: '480'
          UX_FONT: '2.0'
          UX_LOCALE: ru
          UX_ORIENTATION: portrait
          UX_THEME: light
          UX_FEEL: 'false'
          UX_CLASS: ru.tabatabata.UxAuditProbe#b_editorValidationAppearanceAndLeaveDialog
        with:
          api-level: 35
          avd-name: tabata-ui
          pre-emulator-launch-script: python3 scripts/ux/configure-avd.py
          ram-size: 3072
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ux/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-keyboard-ru-200
          path: ui-audit-results/
