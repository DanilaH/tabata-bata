name: Independent timer audit
on:
  push:
    branches: [main]
    paths: ['scripts/audit/**', '.github/workflows/audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install audit-only probes
        run: |
          cp scripts/audit/AuditEngineProbe.kt app/src/test/java/ru/tabatabata/
          cp scripts/audit/AuditUiProbe.kt scripts/audit/AuditStoreProbe.kt app/src/androidTest/java/ru/tabatabata/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest
            bash scripts/audit/run-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-audit-evidence
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/audit.mp4
